<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkeys Kitchen</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      overflow: hidden;
      perspective: 1000px; /* para efecto 3D */
    }

    .logo {
      max-width: 80vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      opacity: 0;
      filter: blur(20px);
      transform: scale(0.5) rotateY(0deg);
      animation: modernAppear 5s ease forwards;
    }

    @keyframes modernAppear {
      0% {
        opacity: 0;
        filter: blur(20px);
        transform: scale(0.5) rotateY(0deg);
      }
      50% {
        opacity: 1;
        filter: blur(5px);
        transform: scale(1.2) rotateY(180deg);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1) rotateY(360deg);
      }
    }

    h1 {
      position: absolute;
      bottom: 5vh;
      color: gold;
      font-family: 'Arial Black', sans-serif;
      font-size: 5vw;
      text-shadow: 2px 2px 8px black;
      opacity: 0;
      animation: fadeInText 2s ease forwards 3s;
      text-align: center;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ajustes para pantallas pequeñas */
    @media (max-width: 600px) {
      h1 {
        font-size: 7vw;
      }
      .logo {
        max-width: 90vw;
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <img src="img/Monkeys.jpg" alt="Monkeys Kitchen Logo" class="logo">
  <h1>MONKEYS KITCHEN</h1>

  <script>
    // Redirige al PDF después de 7 segundos
    setTimeout(() => {
      window.location.href = "MonkeysMenu-v0.pdf";
    }, 7000);
  </script>
</body>
</html>
