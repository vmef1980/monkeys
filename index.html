<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkeys Kitchen</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("img/Monkeys.jpg") no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }

    .overlay {
      background-color: rgba(0,0,0,0.6);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeZoom 3s ease forwards;
    }

    .monkeys {
      display: flex;
      gap: 40px;
    }

    .monkey {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: gold;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
      color: black;
      animation: bounce 1.5s infinite alternate;
    }

    .monkey:nth-child(2) { animation-delay: 0.3s; }
    .monkey:nth-child(3) { animation-delay: 0.6s; }

    h1 {
      margin-top: 30px;
      color: gold;
      font-family: 'Arial Black', sans-serif;
      font-size: 2em;
      text-shadow: 2px 2px 8px black;
      opacity: 0;
      animation: fadeInText 2s ease forwards 1.5s;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-40px); }
    }

    @keyframes fadeZoom {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeInText {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="monkeys">
      <div class="monkey">🐵</div>
      <div class="monkey">🙈</div>
      <div class="monkey">🙉</div>
    </div>
    <h1>MONKEYS KITCHEN</h1>
  </div>

  <script>
    // Redirige al PDF después de 6 segundos
    setTimeout(() => {
      window.location.href = "MonkeysMenu-v0.pdf";
    }, 6000);
  </script>
</body>
</html>
